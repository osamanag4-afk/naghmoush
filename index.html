<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>نموذج المخ البشري التفاعلي</title>
<style>
  :root {
    --bg: #050d1a;
    --surface: #0a1628;
    --surface2: #0f1f3d;
    --border: #1a3a6b;
    --accent: #00d4ff;
    --text: #c8e0ff;
    --text-muted: #5a7fa8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Tahoma, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .page-wrap { position: relative; z-index: 1; padding: 16px; max-width: 600px; margin: 0 auto; }

  header {
    text-align: center;
    padding: 20px 0 12px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }
  .header-tag {
    display: inline-block;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
    border: 1px solid var(--accent);
    padding: 3px 10px;
    border-radius: 2px;
    margin-bottom: 10px;
    opacity: 0.8;
  }
  header h1 {
    font-size: clamp(18px, 5vw, 26px);
    font-weight: 700;
    background: linear-gradient(135deg, #fff 30%, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.3;
  }
  header p { font-size: 12px; color: var(--text-muted); margin-top: 6px; }

  .brain-container {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 20px;
    position: relative;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.4), 0 0 30px rgba(0,212,255,0.05);
  }
  .brain-container::before {
    content: 'NEURAL MAP v3.0';
    position: absolute;
    top: 10px;
    left: 14px;
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--text-muted);
  }
  .brain-container::after {
    content: '● LIVE';
    position: absolute;
    top: 10px;
    right: 14px;
    font-size: 9px;
    color: #3dd68c;
    letter-spacing: 1px;
    animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .brain-svg-wrapper {
    margin-top: 8px;
    display: flex;
    justify-content: center;
  }

  svg#brain {
    width: 100%;
    max-width: 520px;
    height: auto;
    filter: drop-shadow(0 0 24px rgba(0,212,255,0.12));
  }

  .brain-region {
    cursor: pointer;
    transition: filter 0.2s;
  }
  .brain-region:hover > path,
  .brain-region:hover > ellipse {
    filter: brightness(1.35) drop-shadow(0 0 10px currentColor);
  }
  .brain-region.active > path,
  .brain-region.active > ellipse {
    animation: pulse-r 1.4s ease-in-out infinite;
  }
  @keyframes pulse-r {
    0%,100%{ filter: brightness(1.5) drop-shadow(0 0 10px currentColor); }
    50%{ filter: brightness(2) drop-shadow(0 0 22px currentColor); }
  }

  .region-label {
    font-size: 10px;
    fill: rgba(255,255,255,0.92);
    font-family: 'Segoe UI', sans-serif;
    pointer-events: none;
    text-anchor: middle;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }

  .tap-hint {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 10px;
    letter-spacing: 1px;
  }

  .legend {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 20px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .legend-item:hover { border-color: var(--accent); background: var(--surface2); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-text { font-size: 11px; color: var(--text); line-height: 1.3; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 600px;
    max-height: 85vh;
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    padding: 0 0 32px;
  }
  .modal-overlay.open .modal { transform: translateY(0); }

  .modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 0; }

  .modal-header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 2;
  }
  .modal-color-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 10px currentColor; }
  .modal-title { font-size: 18px; font-weight: 700; color: #fff; flex: 1; }
  .modal-close {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text-muted); font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .modal-close:hover { color: #fff; border-color: var(--accent); }

  .modal-body { padding: 16px 20px 0; }

  .info-section {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
    animation: fadeUpIn 0.4s both;
  }
  .info-section:nth-child(2) { animation-delay: 0.08s; }
  .info-section:nth-child(3) { animation-delay: 0.16s; }

  @keyframes fadeUpIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .section-tag {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--accent); margin-bottom: 8px;
  }
  .section-tag .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }

  .info-section h3 { font-size: 13px; color: #fff; font-weight: 600; margin-bottom: 6px; line-height: 1.4; }
  .info-section p, .info-section li { font-size: 12.5px; color: var(--text); line-height: 1.7; }
  .info-section ul { padding-right: 16px; }
  .info-section li { margin-bottom: 4px; }

  .headache-location {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 12px;
    background: rgba(232,93,150,0.08);
    border: 1px solid rgba(232,93,150,0.2);
    border-radius: 8px; margin-top: 8px;
  }
  .pain-icon { font-size: 22px; flex-shrink: 0; margin-top: 2px; }
  .pain-text { font-size: 12px; color: var(--text); line-height: 1.6; }

  footer {
    text-align: center; padding: 12px 0 20px;
    color: var(--text-muted); font-size: 10px; letter-spacing: 1px;
    border-top: 1px solid var(--border); margin-top: 4px;
  }

  .scan-line { animation: scan 3s linear infinite; }
  @keyframes scan {
    from { transform: translateY(-220px); opacity: 0.6; }
    to   { transform: translateY(430px); opacity: 0; }
  }
</style>
</head>

    <div class="info-section">
      <div class="section-tag"><span class="dot"></span> ANATOMICAL NAME</div>
      <h3>${d.name} &nbsp;<span style="color:var(--text-muted);font-size:11px;font-weight:400">${d.latin}</span></h3>
    </div>
    <div class="info-section">
      <div class="section-tag"><span class="dot"></span> PRIMARY FUNCTIONS</div>
      <ul>${d.functions.map(f=>`<li>${f}</li>`).join('')}</ul>
    </div>
    <div class="info-section">
      <div class="section-tag" style="color:#f87171"><span class="dot" style="background:#f87171"></span> HEADACHE PROFILE</div>
      <div class="headache-location">
        <span class="pain-icon">🧠</span>
        <div class="pain-text"><strong style="color:#fff;display:block;margin-bottom:4px">موضع الألم:</strong>${d.headacheLocation}</div>
      </div>
      <div style="margin-top:10px">
        <div class="section-tag" style="color:var(--text-muted);margin-bottom:6px"><span class="dot" style="background:var(--text-muted)"></span> الأعراض المحتملة</div>
        <ul>${symptomsHtml}</ul>
      </div>
    </div>`;
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
  if (activeRegion) {
    document.querySelectorAll(`[data-region="${activeRegion}"]`).forEach(el=>el.classList.remove('active'));
    activeRegion = null;
  }
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

let touchStartY = 0;
document.getElementById('modal').addEventListener('touchstart', e=>{ touchStartY = e.touches[0].clientY; }, {passive:true});
document.getElementById('modal').addEventListener('touchmove', e=>{ if(e.touches[0].clientY - touchStartY > 60) closeModal(); }, {passive:true});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
</script>
</body>
</html>
