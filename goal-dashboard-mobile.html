<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <!--
    iPhone 13 Pro Max
    Logical : 428 × 926 pt  |  Physical : 1284 × 2778 px (3×)
    Status bar top  : ~47 pt  → env(safe-area-inset-top)
    Home indicator  : ~34 pt  → env(safe-area-inset-bottom)
  -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable"            content="yes">
  <meta name="apple-mobile-web-app-status-bar-style"   content="black-translucent">
  <meta name="apple-mobile-web-app-title"              content="أهدافي">
  <title>أهدافي</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Cairo Arabic font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap"
        rel="stylesheet">

  <!-- React 18 UMD -->
  <script crossorigin
    src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin
    src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Recharts 2 UMD  (global: Recharts) -->
  <script src="https://unpkg.com/recharts@2.8.0/umd/Recharts.js"></script>

  <!-- Framer Motion 6  (global: window.Motion) -->
  <script src="https://unpkg.com/framer-motion@6.5.1/dist/framer-motion.js"></script>

  <!-- Lucide React UMD  (global: lucideReact) -->
  <script src="https://unpkg.com/lucide-react@0.263.1/dist/umd/lucide-react.js"></script>

  <!-- Babel standalone – compiles JSX in the browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *, *::before, *::after {
      font-family: 'Cairo', sans-serif;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body, #root {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      direction: rtl;
      background: #080514;
    }
    /* Hide scrollbars, keep native scroll */
    .scroll-area {
      overflow-y: scroll;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }
    ::-webkit-scrollbar { display: none; }

    /* Prevent iOS double-tap zoom on inputs */
    input, textarea { font-size: 16px !important; -webkit-appearance: none; }

    .glass {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.10);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .chrome-bar {
      background: rgba(8,5,20,0.80);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">

  /* ── 1. Verify CDN libraries loaded ─────────────────────────────── */
  const _fm = window.Motion || window.FramerMotion || window.framerMotion;
  if (!_fm) {
    document.getElementById('root').innerHTML =
      '<p style="color:#f87171;text-align:center;padding:40px 20px;font-family:Cairo,sans-serif">' +
      '⚠️ لم يتحمّل framer-motion. تأكد من الاتصال بالإنترنت ثم أعد تحميل الصفحة.</p>';
    throw new Error('framer-motion CDN not loaded');
  }

  /* ── 2. Named imports from CDN globals ──────────────────────────── */
  const { useState, useEffect, useCallback } = React;

  const { motion, AnimatePresence } = _fm;

  const {
    ResponsiveContainer, BarChart, Bar,
    XAxis, YAxis, CartesianGrid, Cell
  } = Recharts;

  /* Only icons confirmed to exist in lucide-react@0.263 */
  const {
    Plus, Trash2, CheckCircle2, Circle,
    Target, TrendingUp, ChevronDown, ChevronUp,
    Sparkles, Award, BarChart2, X
  } = lucideReact;

  /* ── 3. Constants ───────────────────────────────────────────────── */
  const STORAGE_KEY = 'goal_impact_mobile_v3';

  const PALETTE = [
    { a:'#7c3aed', b:'#a855f7', glow:'rgba(139,92,246,0.45)' },
    { a:'#1d4ed8', b:'#06b6d4', glow:'rgba(59,130,246,0.45)'  },
    { a:'#047857', b:'#14b8a6', glow:'rgba(16,185,129,0.45)'  },
    { a:'#be123c', b:'#ec4899', glow:'rgba(244,63,94,0.45)'   },
    { a:'#b45309', b:'#f97316', glow:'rgba(245,158,11,0.45)'  },
  ];

  const DAYS = ['أحد','إثن','ثلا','أرب','خمس','جمع','سبت'];

  /* ── 4. Helpers ─────────────────────────────────────────────────── */
  const uid = () => `${Date.now()}-${Math.random().toString(36).slice(2,7)}`;

  const goalPct = g => {
    if (!g.subtasks.length) return 0;
    return Math.round(g.subtasks.filter(s=>s.done).length / g.subtasks.length * 100);
  };

  const globalPct = goals => {
    const t = goals.reduce((a,g) => a + g.subtasks.length, 0);
    const d = goals.reduce((a,g) => a + g.subtasks.filter(s=>s.done).length, 0);
    return t === 0 ? 0 : Math.round(d / t * 100);
  };

  const weekData = goals =>
    DAYS.map((day,i) => ({
      day,
      v: goals.reduce((acc,g) =>
        acc + g.subtasks.filter(s => s.done && s.completedDay === i).length, 0),
    }));

  /* ── 5. Primitives ──────────────────────────────────────────────── */

  /* Animated SVG ring */
  function Ring({ pct, size=110, stroke=9, color='#8b5cf6' }) {
    const r    = (size - stroke) / 2;
    const circ = 2 * Math.PI * r;
    const cx = size / 2, cy = size / 2;
    return (
      <svg width={size} height={size}
           viewBox={`0 0 ${size} ${size}`}
           style={{ transform:'rotate(-90deg)', display:'block' }}>
        <circle cx={cx} cy={cy} r={r} fill="none"
          stroke="rgba(255,255,255,0.08)" strokeWidth={stroke} />
        <motion.circle cx={cx} cy={cy} r={r} fill="none"
          stroke={color} strokeWidth={stroke} strokeLinecap="round"
          strokeDasharray={circ}
          initial={{ strokeDashoffset: circ }}
          animate={{ strokeDashoffset: circ - circ * (pct / 100) }}
          transition={{ duration: 1.3, ease: 'easeOut' }}
        />
      </svg>
    );
  }

  /* Glass card wrapper */
  function GCard({ children, style, className='' }) {
    return (
      <div className={`glass rounded-3xl ${className}`} style={style}>
        {children}
      </div>
    );
  }

  /* Gradient button */
  function GBtn({ children, onClick, pal, className='', style={} }) {
    return (
      <motion.button
        whileTap={{ scale: .93 }}
        onClick={onClick}
        className={`flex items-center justify-center gap-1.5 font-bold text-white ${className}`}
        style={{
          background: `linear-gradient(135deg,${pal.a},${pal.b})`,
          boxShadow:  `0 6px 20px ${pal.glow}`,
          ...style,
        }}
      >{children}</motion.button>
    );
  }

  /* ── 6. Dashboard Tab ───────────────────────────────────────────── */
  function DashboardTab({ goals }) {
    const pct   = globalPct(goals);
    const total = goals.reduce((a,g) => a + g.subtasks.length, 0);
    const done  = goals.reduce((a,g) => a + g.subtasks.filter(s=>s.done).length, 0);
    const doneG = goals.filter(g => goalPct(g) === 100).length;
    const today = new Date().getDay();
    const data  = weekData(goals);

    /* Using only confirmed icons */
    const stats = [
      { label:'الأهداف',  value: goals.length, Icon: Target,       pal: PALETTE[0] },
      { label:'مكتملة',   value: doneG,        Icon: Award,        pal: PALETTE[2] },
      { label:'المهام',   value: total,        Icon: BarChart2,    pal: PALETTE[1] },
      { label:'منجز',     value: done,         Icon: CheckCircle2, pal: PALETTE[2] },
    ];

    return (
      <div style={{ display:'flex', flexDirection:'column', gap:16, paddingBottom:16 }}>

        {/* ── Hero: global progress ── */}
        <motion.div
          initial={{ opacity:0, y:18 }}
          animate={{ opacity:1, y:0 }}
          transition={{ delay:.05 }}
        >
          <GCard style={{
            background:'linear-gradient(140deg,rgba(124,58,237,.25),rgba(168,85,247,.10))'
          }} className="p-5">
            <div className="flex items-center gap-4">

              {/* Ring */}
              <div className="relative flex-shrink-0"
                   style={{ width:110, height:110 }}>
                <Ring pct={pct} size={110} stroke={9} color={PALETTE[0].a} />
                <div className="absolute inset-0 flex flex-col items-center justify-center">
                  <motion.span key={pct}
                    initial={{ scale:.75, opacity:0 }}
                    animate={{ scale:1,   opacity:1 }}
                    className="font-black text-white"
                    style={{ fontSize:28, lineHeight:1 }}
                  >{pct}%</motion.span>
                  <span style={{ fontSize:11, color:'rgba(255,255,255,0.4)', marginTop:2 }}>
                    مكتمل
                  </span>
                </div>
              </div>

              {/* Text + bar */}
              <div className="flex-1 min-w-0">
                <p style={{ color:'rgba(255,255,255,0.45)', fontSize:12,
                            fontWeight:600, marginBottom:2 }}>
                  التقدم العالمي
                </p>
                <p className="text-white font-black" style={{ fontSize:22, lineHeight:1.2 }}>
                  {done}
                  <span style={{ color:'rgba(255,255,255,0.35)',
                                 fontSize:15, fontWeight:600 }}> / {total}</span>
                </p>
                <p style={{ color:'rgba(255,255,255,0.35)', fontSize:12, marginBottom:10 }}>
                  مهمة منجزة
                </p>
                <div className="rounded-full overflow-hidden"
                     style={{ height:8, background:'rgba(255,255,255,0.08)' }}>
                  <motion.div className="h-full rounded-full"
                    style={{ background:`linear-gradient(to right,${PALETTE[0].a},${PALETTE[0].b})` }}
                    initial={{ width:0 }}
                    animate={{ width:`${pct}%` }}
                    transition={{ duration:1.2, ease:'easeOut' }}
                  />
                </div>
              </div>
            </div>
          </GCard>
        </motion.div>

        {/* ── 2×2 stat grid ── */}
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
          {stats.map((s,i) => (
            <motion.div key={s.label}
              initial={{ opacity:0, scale:.88 }}
              animate={{ opacity:1, scale:1   }}
              transition={{ delay:.1 + i*.07 }}
            >
              <GCard className="p-4">
                <div className="flex items-center gap-2" style={{ marginBottom:10 }}>
                  <div style={{
                    width:32, height:32, borderRadius:10, flexShrink:0,
                    display:'flex', alignItems:'center', justifyContent:'center',
                    background:`linear-gradient(135deg,${s.pal.a},${s.pal.b})`,
                  }}>
                    <s.Icon size={15} color="#fff" />
                  </div>
                  <span style={{ color:'rgba(255,255,255,0.42)',
                                 fontSize:12, fontWeight:600 }}>{s.label}</span>
                </div>
                <p className="text-white font-black" style={{ fontSize:32, lineHeight:1 }}>
                  {s.value}
                </p>
              </GCard>
            </motion.div>
          ))}
        </div>

        {/* ── Weekly bar chart ── */}
        <motion.div
          initial={{ opacity:0, y:18 }}
          animate={{ opacity:1, y:0 }}
          transition={{ delay:.38 }}
        >
          <GCard className="p-5">
            <div className="flex items-center gap-2" style={{ marginBottom:16 }}>
              <BarChart2 size={16} color="#3b82f6" />
              <p style={{ color:'rgba(255,255,255,0.62)', fontSize:14,
                          fontWeight:700 }}>إنجاز هذا الأسبوع</p>
              <div style={{ flex:1 }} />
              <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                <div style={{ width:8, height:8, borderRadius:'50%',
                              background:'#8b5cf6' }} />
                <span style={{ color:'rgba(255,255,255,0.28)', fontSize:10 }}>اليوم</span>
              </div>
            </div>
            <ResponsiveContainer width="100%" height={130}>
              <BarChart data={data}
                margin={{ top:0, right:0, bottom:0, left:-30 }}>
                <CartesianGrid strokeDasharray="2 4"
                  stroke="rgba(255,255,255,0.04)" vertical={false} />
                <XAxis dataKey="day" axisLine={false} tickLine={false}
                  tick={{ fontSize:10, fill:'rgba(255,255,255,0.32)',
                          fontFamily:'Cairo' }} />
                <YAxis axisLine={false} tickLine={false} allowDecimals={false}
                  tick={{ fontSize:10, fill:'rgba(255,255,255,0.32)' }} />
                <Bar dataKey="v" radius={[5,5,0,0]} maxBarSize={28}>
                  {data.map((_,i) => (
                    <Cell key={i}
                      fill={i === today ? '#8b5cf6' : 'rgba(139,92,246,0.22)'} />
                  ))}
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          </GCard>
        </motion.div>
      </div>
    );
  }

  /* ── 7. Subtask row ─────────────────────────────────────────────── */
  function SubRow({ sub, accent, onToggle, onDelete }) {
    return (
      <motion.div
        initial={{ opacity:0, x:16 }}
        animate={{ opacity:1, x:0  }}
        exit={{   opacity:0, x:-16 }}
        className="flex items-center gap-3 group"
        style={{ padding:'8px 0' }}
      >
        <motion.button whileTap={{ scale:.8 }} onClick={onToggle}
          style={{ flexShrink:0 }}>
          {sub.done
            ? <CheckCircle2 size={20} color={accent} />
            : <Circle       size={20} color="rgba(255,255,255,0.25)" />}
        </motion.button>
        <span style={{
          flex:1, fontSize:14, lineHeight:1.4,
          textDecoration: sub.done ? 'line-through' : 'none',
          color: sub.done ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.75)',
        }}>{sub.text}</span>
        <motion.button whileTap={{ scale:.8 }} onClick={onDelete}
          className="opacity-0 group-hover:opacity-100 transition-opacity"
          style={{ padding:4 }}>
          <X size={13} color="rgba(255,255,255,0.28)" />
        </motion.button>
      </motion.div>
    );
  }

  /* ── 8. Goal card ───────────────────────────────────────────────── */
  function GoalCard({ goal, pal, onDelete, onToggleSub, onDeleteSub, onAddSub }) {
    const [open,   setOpen]   = useState(true);
    const [newSub, setNewSub] = useState('');
    const pct = goalPct(goal);

    const addSub = () => {
      if (!newSub.trim()) return;
      onAddSub(newSub.trim());
      setNewSub('');
    };

    return (
      <motion.div
        initial={{ opacity:0, y:20 }}
        animate={{ opacity:1, y:0  }}
        exit={{   opacity:0, scale:.92 }}
        transition={{ duration:.2 }}
      >
        <GCard className="overflow-hidden">

          {/* Colour strip */}
          <div style={{
            height:3,
            background:`linear-gradient(to right,${pal.a},${pal.b})`,
          }} />

          <div className="p-4">

            {/* Title row */}
            <div className="flex items-start justify-between gap-2"
                 style={{ marginBottom:12 }}>
              <div style={{ flex:1, minWidth:0 }}>
                <p className="text-white font-bold"
                   style={{ fontSize:16, lineHeight:1.35 }}>{goal.title}</p>
                {goal.description && (
                  <p style={{ color:'rgba(255,255,255,0.35)', fontSize:12,
                              marginTop:2 }}>{goal.description}</p>
                )}
              </div>
              <div className="flex gap-1.5 flex-shrink-0" style={{ marginTop:2 }}>
                <motion.button whileTap={{ scale:.82 }} onClick={() => setOpen(v=>!v)}
                  style={{
                    width:32, height:32, borderRadius:10, flexShrink:0,
                    display:'flex', alignItems:'center', justifyContent:'center',
                    background:'rgba(255,255,255,0.07)',
                  }}>
                  {open
                    ? <ChevronUp   size={14} color="rgba(255,255,255,0.55)" />
                    : <ChevronDown size={14} color="rgba(255,255,255,0.55)" />}
                </motion.button>
                <motion.button whileTap={{ scale:.82 }} onClick={onDelete}
                  style={{
                    width:32, height:32, borderRadius:10, flexShrink:0,
                    display:'flex', alignItems:'center', justifyContent:'center',
                    background:'rgba(244,63,94,0.1)',
                  }}>
                  <Trash2 size={14} color="rgba(244,63,94,0.75)" />
                </motion.button>
              </div>
            </div>

            {/* Progress */}
            <div style={{ marginBottom: open ? 4 : 0 }}>
              <div className="flex justify-between items-center"
                   style={{ marginBottom:6 }}>
                <span style={{ color:'rgba(255,255,255,0.35)', fontSize:12 }}>
                  {goal.subtasks.filter(s=>s.done).length}/{goal.subtasks.length} مهمة
                </span>
                <motion.span key={pct}
                  initial={{ scale:.8 }} animate={{ scale:1 }}
                  style={{ fontSize:12, fontWeight:700, color: pal.b }}
                >{pct}%</motion.span>
              </div>
              <div className="rounded-full overflow-hidden"
                   style={{ height:6, background:'rgba(255,255,255,0.07)' }}>
                <motion.div className="h-full rounded-full"
                  style={{ background:`linear-gradient(to right,${pal.a},${pal.b})` }}
                  initial={{ width:0 }}
                  animate={{ width:`${pct}%` }}
                  transition={{ duration:.8, ease:'easeOut' }}
                />
              </div>
            </div>

            {/* Collapsible subtasks */}
            <AnimatePresence>
              {open && (
                <motion.div
                  initial={{ height:0, opacity:0 }}
                  animate={{ height:'auto', opacity:1 }}
                  exit={{   height:0, opacity:0 }}
                  transition={{ duration:.22 }}
                  style={{ overflow:'hidden' }}
                >
                  <div style={{ marginTop:8 }}>
                    <AnimatePresence>
                      {goal.subtasks.length === 0 && (
                        <motion.p key="empty"
                          initial={{ opacity:0 }} animate={{ opacity:1 }}
                          exit={{   opacity:0 }}
                          style={{ color:'rgba(255,255,255,0.18)',
                                   fontSize:12, textAlign:'center', padding:'12px 0' }}
                        >لا توجد مهام بعد</motion.p>
                      )}
                      {goal.subtasks.map(s => (
                        <SubRow key={s.id} sub={s} accent={pal.b}
                          onToggle={() => onToggleSub(s.id)}
                          onDelete={() => onDeleteSub(s.id)} />
                      ))}
                    </AnimatePresence>

                    {/* Add subtask */}
                    <div className="flex items-center gap-2 rounded-2xl"
                         style={{
                           padding:'10px 12px', marginTop:8,
                           background:'rgba(255,255,255,0.05)',
                           border:'1px solid rgba(255,255,255,0.08)',
                         }}>
                      <input
                        value={newSub}
                        onChange={e => setNewSub(e.target.value)}
                        onKeyDown={e => e.key==='Enter' && addSub()}
                        placeholder="أضف مهمة فرعية..."
                        style={{
                          flex:1, background:'transparent',
                          border:'none', outline:'none',
                          color:'rgba(255,255,255,0.85)',
                          fontSize:14, textAlign:'right',
                        }}
                      />
                      <motion.button whileTap={{ scale:.82 }} onClick={addSub}
                        style={{
                          width:28, height:28, borderRadius:8, flexShrink:0,
                          display:'flex', alignItems:'center', justifyContent:'center',
                          background:`linear-gradient(135deg,${pal.a},${pal.b})`,
                        }}>
                        <Plus size={13} color="#fff" />
                      </motion.button>
                    </div>
                  </div>
                </motion.div>
              )}
            </AnimatePresence>
          </div>
        </GCard>
      </motion.div>
    );
  }

  /* ── 9. Goals Tab ───────────────────────────────────────────────── */
  function GoalsTab({ goals, onDelete, onToggleSub, onDeleteSub, onAddSub, openAdd }) {
    return (
      <div style={{ display:'flex', flexDirection:'column',
                    gap:12, paddingBottom:16 }}>
        <AnimatePresence>
          {goals.length === 0 && (
            <motion.div key="empty"
              initial={{ opacity:0, y:20 }}
              animate={{ opacity:1, y:0  }}
              className="flex flex-col items-center gap-5 text-center"
              style={{ padding:'64px 0' }}
            >
              <div style={{
                width:96, height:96, borderRadius:24,
                display:'flex', alignItems:'center', justifyContent:'center',
                background:'rgba(124,58,237,0.18)',
                border:'1px solid rgba(124,58,237,0.3)',
              }}>
                <Target size={40} color="rgba(168,85,247,0.8)" />
              </div>
              <div>
                <p className="text-white font-black" style={{ fontSize:20, marginBottom:6 }}>
                  ابدأ رحلتك!
                </p>
                <p style={{ color:'rgba(255,255,255,0.35)', fontSize:14 }}>
                  أضف هدفك الأول وابدأ التتبع
                </p>
              </div>
              <GBtn pal={PALETTE[0]} onClick={openAdd}
                style={{ padding:'14px 24px', borderRadius:16, fontSize:14 }}>
                <Plus size={16} />
                أضف أول هدف
              </GBtn>
            </motion.div>
          )}
          {goals.map((g,i) => (
            <GoalCard key={g.id} goal={g}
              pal={PALETTE[g.colorIdx ?? i % PALETTE.length]}
              onDelete={()     => onDelete(g.id)}
              onToggleSub={sid => onToggleSub(g.id, sid)}
              onDeleteSub={sid => onDeleteSub(g.id, sid)}
              onAddSub={text   => onAddSub(g.id, text)}
            />
          ))}
        </AnimatePresence>
      </div>
    );
  }

  /* ── 10. Add-Goal Bottom Sheet ──────────────────────────────────── */
  function AddSheet({ onClose, onAdd }) {
    const [title, setTitle] = useState('');
    const [desc,  setDesc]  = useState('');

    const submit = () => {
      if (!title.trim()) return;
      onAdd({ title: title.trim(), description: desc.trim() });
      onClose();
    };

    return (
      <motion.div
        initial={{ opacity:0 }} animate={{ opacity:1 }} exit={{ opacity:0 }}
        className="fixed inset-0 z-50 flex flex-col justify-end"
        style={{
          background:'rgba(0,0,0,0.65)',
          backdropFilter:'blur(6px)',
          WebkitBackdropFilter:'blur(6px)',
        }}
        onClick={e => e.target === e.currentTarget && onClose()}
      >
        <motion.div
          initial={{ y:'100%' }}
          animate={{ y:0       }}
          exit={{   y:'100%'  }}
          transition={{ type:'spring', stiffness:280, damping:28 }}
          style={{
            borderRadius:'32px 32px 0 0',
            overflow:'hidden',
            background:'linear-gradient(170deg,#13093a,#0d1b38)',
            border:'1px solid rgba(255,255,255,0.09)',
            paddingBottom:'env(safe-area-inset-bottom,34px)',
          }}
        >
          {/* Drag handle */}
          <div style={{ display:'flex', justifyContent:'center',
                        paddingTop:12, paddingBottom:4 }}>
            <div style={{ width:36, height:4, borderRadius:2,
                          background:'rgba(255,255,255,0.2)' }} />
          </div>

          <div style={{ padding:'12px 20px 20px' }}>
            {/* Header */}
            <div className="flex items-center justify-between" style={{ marginBottom:20 }}>
              <h2 className="text-white font-black flex items-center gap-2"
                  style={{ fontSize:20 }}>
                <Sparkles size={20} color="#a855f7" />
                هدف جديد
              </h2>
              <motion.button whileTap={{ scale:.85 }} onClick={onClose}
                style={{
                  width:36, height:36, borderRadius:10,
                  display:'flex', alignItems:'center', justifyContent:'center',
                  background:'rgba(255,255,255,0.07)',
                }}>
                <X size={17} color="rgba(255,255,255,0.55)" />
              </motion.button>
            </div>

            {/* Fields */}
            <div style={{ display:'flex', flexDirection:'column', gap:12, marginBottom:20 }}>
              <div>
                <p style={{ color:'rgba(255,255,255,0.42)', fontSize:12,
                            fontWeight:600, marginBottom:8 }}>عنوان الهدف *</p>
                <input autoFocus
                  value={title}
                  onChange={e => setTitle(e.target.value)}
                  onKeyDown={e => e.key==='Enter' && submit()}
                  placeholder="ما الهدف الذي تريد تحقيقه؟"
                  style={{
                    width:'100%', padding:'14px 16px',
                    borderRadius:16, border:'1px solid rgba(255,255,255,0.1)',
                    background:'rgba(255,255,255,0.07)',
                    color:'#fff', outline:'none', textAlign:'right',
                    fontSize:15,
                  }}
                />
              </div>
              <div>
                <p style={{ color:'rgba(255,255,255,0.42)', fontSize:12,
                            fontWeight:600, marginBottom:8 }}>وصف (اختياري)</p>
                <textarea rows={2}
                  value={desc}
                  onChange={e => setDesc(e.target.value)}
                  placeholder="وصف مختصر..."
                  style={{
                    width:'100%', padding:'14px 16px',
                    borderRadius:16, border:'1px solid rgba(255,255,255,0.1)',
                    background:'rgba(255,255,255,0.07)',
                    color:'#fff', outline:'none', resize:'none', textAlign:'right',
                    fontSize:15,
                  }}
                />
              </div>
            </div>

            {/* Buttons */}
            <div style={{ display:'flex', gap:12 }}>
              <GBtn pal={PALETTE[0]} onClick={submit}
                style={{ flex:1, padding:'16px', borderRadius:16, fontSize:16 }}>
                إضافة الهدف
              </GBtn>
              <motion.button whileTap={{ scale:.95 }} onClick={onClose}
                style={{
                  padding:'16px 20px', borderRadius:16, fontSize:14, fontWeight:600,
                  color:'rgba(255,255,255,0.55)',
                  background:'rgba(255,255,255,0.07)',
                  border:'1px solid rgba(255,255,255,0.09)',
                }}>
                إلغاء
              </motion.button>
            </div>
          </div>
        </motion.div>
      </motion.div>
    );
  }

  /* ── 11. App shell ──────────────────────────────────────────────── */
  function App() {
    const [goals,   setGoals]   = useState(() => {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch { return []; }
    });
    const [tab,     setTab]     = useState('dashboard');
    const [showAdd, setShowAdd] = useState(false);

    useEffect(() => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(goals));
    }, [goals]);

    const addGoal     = useCallback(({ title, description }) => {
      setGoals(p => [{
        id: uid(), title, description,
        subtasks:[], colorIdx: p.length % PALETTE.length,
        createdAt: Date.now(),
      }, ...p]);
    }, []);

    const deleteGoal  = useCallback(id =>
      setGoals(p => p.filter(g => g.id !== id)), []);

    const addSubtask  = useCallback((gid, text) =>
      setGoals(p => p.map(g => g.id !== gid ? g : {
        ...g, subtasks: [...g.subtasks, { id:uid(), text, done:false }],
      })), []);

    const delSubtask  = useCallback((gid, sid) =>
      setGoals(p => p.map(g => g.id !== gid ? g : {
        ...g, subtasks: g.subtasks.filter(s => s.id !== sid),
      })), []);

    const toggleSub   = useCallback((gid, sid) => {
      const today = new Date().getDay();
      setGoals(p => p.map(g => g.id !== gid ? g : {
        ...g, subtasks: g.subtasks.map(s => s.id !== sid ? s : {
          ...s, done:!s.done, completedDay:!s.done ? today : undefined,
        }),
      }));
    }, []);

    const TABS = [
      { id:'dashboard', label:'لوحة',  Icon: BarChart2 },
      { id:'goals',     label:'أهداف', Icon: Target    },
    ];

    return (
      <div style={{
        position:'fixed', inset:0,
        background:'linear-gradient(165deg,#080514 0%,#100929 45%,#071220 100%)',
      }}>

        {/* Ambient glow */}
        <div aria-hidden="true" style={{
          position:'absolute', inset:0,
          pointerEvents:'none', overflow:'hidden',
        }}>
          <div style={{
            position:'absolute', top:'-10%', right:'-20%',
            width:280, height:280, borderRadius:'50%',
            filter:'blur(72px)',
            background:'radial-gradient(circle,rgba(124,58,237,.30),transparent)',
          }} />
          <div style={{
            position:'absolute', bottom:'18%', left:'-12%',
            width:220, height:220, borderRadius:'50%',
            filter:'blur(64px)',
            background:'radial-gradient(circle,rgba(29,78,216,.22),transparent)',
          }} />
        </div>

        {/* ── APP BAR
            inner height  = 44px
            top padding   = safe-area-inset-top + 10px
            bot padding   = 10px
            total height  = safe-area-inset-top + 64px
        ── */}
        <div className="chrome-bar" style={{
          position:'absolute', top:0, left:0, right:0, zIndex:30,
          paddingTop:  'calc(env(safe-area-inset-top,47px) + 10px)',
          paddingBottom: '10px',
          paddingLeft:  '18px',
          paddingRight: '18px',
          borderBottom: '1px solid rgba(255,255,255,0.07)',
        }}>
          <div className="flex items-center justify-between" style={{ height:44 }}>

            {/* + button */}
            <GBtn pal={PALETTE[0]} onClick={() => setShowAdd(true)}
              style={{ width:44, height:44, borderRadius:14 }}>
              <Plus size={20} />
            </GBtn>

            {/* Title */}
            <div style={{ textAlign:'center' }}>
              <p className="text-white font-black"
                 style={{ fontSize:17, lineHeight:1, letterSpacing:-.3 }}>
                أهدافي
              </p>
              <p style={{ color:'rgba(255,255,255,0.32)', fontSize:11, marginTop:2 }}>
                لوحة تأثير الأهداف
              </p>
            </div>

            {/* Goals count */}
            <div style={{
              width:44, height:44, borderRadius:14,
              display:'flex', alignItems:'center', justifyContent:'center',
              background:'rgba(255,255,255,0.07)',
              border:'1px solid rgba(255,255,255,0.09)',
            }}>
              <span className="text-white font-bold" style={{ fontSize:14 }}>
                {goals.length}
              </span>
            </div>
          </div>
        </div>

        {/* ── SCROLLABLE CONTENT
            top    = safe-area-inset-top + 64px (app bar)
            bottom = safe-area-inset-bottom + 56px (tab bar)
        ── */}
        <div className="scroll-area" style={{
          position:'absolute', left:0, right:0,
          top:    'calc(env(safe-area-inset-top,47px) + 64px)',
          bottom: 'calc(env(safe-area-inset-bottom,34px) + 56px)',
          padding:'14px 16px 0',
        }}>
          <AnimatePresence>
            {tab === 'dashboard' && (
              <motion.div key="dash"
                initial={{ opacity:0, x:24 }}
                animate={{ opacity:1, x:0  }}
                exit={{   opacity:0, x:-24 }}
                transition={{ duration:.2 }}>
                <DashboardTab goals={goals} />
              </motion.div>
            )}
            {tab === 'goals' && (
              <motion.div key="goals"
                initial={{ opacity:0, x:24 }}
                animate={{ opacity:1, x:0  }}
                exit={{   opacity:0, x:-24 }}
                transition={{ duration:.2 }}>
                <GoalsTab
                  goals={goals}
                  onDelete={deleteGoal}
                  onToggleSub={toggleSub}
                  onDeleteSub={delSubtask}
                  onAddSub={addSubtask}
                  openAdd={() => setShowAdd(true)}
                />
              </motion.div>
            )}
          </AnimatePresence>
        </div>

        {/* ── TAB BAR
            inner height  = 56px
            bottom padding = safe-area-inset-bottom
        ── */}
        <div className="chrome-bar" style={{
          position:'absolute', left:0, right:0, bottom:0, zIndex:30,
          paddingBottom:'env(safe-area-inset-bottom,34px)',
          borderTop:'1px solid rgba(255,255,255,0.08)',
        }}>
          <div style={{ display:'flex', height:56 }}>
            {TABS.map(t => {
              const active = tab === t.id;
              return (
                <motion.button key={t.id}
                  whileTap={{ scale:.9 }}
                  onClick={() => setTab(t.id)}
                  style={{
                    flex:1, display:'flex',
                    flexDirection:'column',
                    alignItems:'center', justifyContent:'center',
                    gap:3, position:'relative',
                    background:'none', border:'none', cursor:'pointer',
                  }}
                >
                  {/* Active indicator line */}
                  {active && (
                    <motion.div
                      layoutId="tabIndicator"
                      style={{
                        position:'absolute', top:0,
                        width:32, height:3, borderRadius:'0 0 3px 3px',
                        background:`linear-gradient(to right,${PALETTE[0].a},${PALETTE[0].b})`,
                      }}
                    />
                  )}
                  <t.Icon size={22}
                    color={active ? '#a855f7' : 'rgba(255,255,255,0.28)'}
                    strokeWidth={active ? 2.2 : 1.8}
                  />
                  <span style={{
                    fontSize:10, fontWeight:700, letterSpacing:.3,
                    color: active ? '#a855f7' : 'rgba(255,255,255,0.28)',
                  }}>{t.label}</span>
                </motion.button>
              );
            })}
          </div>
        </div>

        {/* ── ADD GOAL SHEET ── */}
        <AnimatePresence>
          {showAdd && (
            <AddSheet onClose={() => setShowAdd(false)} onAdd={addGoal} />
          )}
        </AnimatePresence>
      </div>
    );
  }

  /* ── 12. Mount ──────────────────────────────────────────────────── */
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>
</body>
</html>
